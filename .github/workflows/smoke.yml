# Spustí aplikaci v emulátoru Androidu, počká na načtení dat a pořídí snímky obrazovky.
# Výsledek (snímky + záznam logcat) uloží do větve "smoke".
name: Zkouška v emulátoru

on:
  workflow_run:
    workflows: ["Sestavení aplikace"]
    types: [completed]
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/workflows/smoke.yml"]

permissions:
  contents: write

jobs:
  smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Stažení APK z větve build
        run: |
          curl -fsSL -o app.apk "https://raw.githubusercontent.com/${{ github.repository }}/build/posledni-spoj.apk"
          ls -l app.apk

      - name: Povolení KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulátor a snímky
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          profile: pixel_6
          script: |
            mkdir -p out
            adb install -r app.apk
            adb shell pm grant cz.poslednispoj android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant cz.poslednispoj android.permission.ACCESS_COARSE_LOCATION || true
            adb logcat -c
            adb shell am start -n cz.poslednispoj/.MainActivity
            sleep 75
            adb exec-out screencap -p > out/1-start.png
            # našeptávač cíle
            adb shell input tap 360 456
            sleep 2
            adb shell input text "nad"
            sleep 3
            adb exec-out screencap -p > out/1b-search.png
            adb shell input keyevent 111
            sleep 2
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true
            sleep 1
            # přiblížení tlačítkem + (3×)
            adb shell input tap 988 2079
            sleep 2
            adb shell input tap 988 2079
            sleep 2
            adb shell input tap 988 2079
            sleep 8
            adb exec-out screencap -p > out/2-zoom.png
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true
            adb shell input tap 385 1957
            sleep 4
            adb exec-out screencap -p > out/3-tap.png
            # klepnutí do mapy mimo cestu: detail se jen sbalí, zastávka zůstane
            adb shell input tap 540 700
            sleep 3
            adb exec-out screencap -p > out/4-route.png
            # klepnutí na sbalený detail ho zase rozbalí
            adb shell input tap 300 2150
            sleep 2
            adb exec-out screencap -p > out/5-detail.png
            # tažení detailu: nahoru na celou obrazovku, pak dolů
            adb shell input swipe 540 1150 540 300 400
            sleep 2
            adb exec-out screencap -p > out/5b-full.png
            adb shell input swipe 540 520 540 1600 400
            sleep 2
            adb exec-out screencap -p > out/5c-down.png
            # horní panel tažením dolů rozbalit
            adb shell input swipe 540 250 540 700 300
            sleep 2
            adb exec-out screencap -p > out/5d-panel.png
            # cesta s přestupy: zastávka vybraná parametrem spuštění, rozbalený 1. a pak 5. úsek
            adb shell am force-stop cz.poslednispoj
            adb shell "am start -n cz.poslednispoj/.MainActivity --es ps_select 'Obora (Boskovice)' --es ps_legs 0 --es ps_zoom 8.3" || true
            sleep 45
            adb exec-out screencap -p > out/6-legA-detail.png
            adb shell input tap 540 900
            sleep 3
            adb exec-out screencap -p > out/6-legA-map.png
            adb shell am force-stop cz.poslednispoj
            adb shell "am start -n cz.poslednispoj/.MainActivity --es ps_select 'Obora (Boskovice)' --es ps_legs 2 --es ps_zoom 8.3" || true
            sleep 45
            adb exec-out screencap -p > out/6-legB-detail.png
            adb shell input tap 540 900
            sleep 3
            adb exec-out screencap -p > out/6-legB-map.png
            sleep 1
            adb logcat -d > out/logcat.txt
            adb logcat -d -b crash > out/crash.txt || true
            adb shell pidof cz.poslednispoj > out/pid.txt || echo "aplikace neběží" > out/pid.txt

      - name: Uložení výsledku do větve smoke
        if: always()
        run: |
          mkdir -p out
          echo "build commit: ${{ github.event.workflow_run.head_sha || github.sha }}" > out/status.txt
          date -u >> out/status.txt
          cd out
          git init -q -b smoke
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Zkouška v emulátoru"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" smoke
