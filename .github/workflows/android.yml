# Sestaví aplikaci po každé změně kódu. Výsledek (APK + záznam sestavení) uloží do větve "build".
name: Sestavení aplikace

on:
  push:
    branches: [main]
    paths: ["app/**", "*.gradle.kts", "gradle/**", "gradle.properties", ".github/workflows/android.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Logo Mapy.com do aplikace
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL --retry 3 -o app/src/main/assets/mapy-logo.svg https://api.mapy.com/img/api/logo.svg || echo "logo se nepodařilo stáhnout"

      - name: Sestavení
        id: build
        continue-on-error: true
        env:
          MAPY_API_KEY: ${{ secrets.MAPY_API_KEY }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Uložení výsledku do větve build
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ || true
          cp -r app/build/test-results out/ 2>/dev/null || true
          D=app/build/outputs/apk/debug
          if [ -f $D/app-universal-debug.apk ]; then cp $D/app-universal-debug.apk out/posledni-spoj.apk; fi
          if [ -f $D/app-arm64-v8a-debug.apk ]; then cp $D/app-arm64-v8a-debug.apk out/posledni-spoj-arm64.apk; fi
          echo "commit: ${{ github.sha }}" > out/status.txt
          echo "result: ${{ steps.build.outcome }}" >> out/status.txt
          date -u >> out/status.txt
          cd out
          git init -q -b build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Sestavení ${{ github.sha }}: ${{ steps.build.outcome }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build

      - name: Příprava souborů k vydání
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p rel
          cp out/posledni-spoj-arm64.apk rel/posledni-spoj.apk
          cp out/posledni-spoj.apk rel/posledni-spoj-univerzalni.apk

      - name: Vydání ke stažení do telefonu
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.${{ github.run_number }}
          name: Poslední spoj 0.3.${{ github.run_number }}
          body: |
            Instalace do telefonu: stáhni posledni-spoj.apk a otevři ho.
            (posledni-spoj-univerzalni.apk je pro starší telefony a emulátor.)
          make_latest: "true"
          files: |
            rel/posledni-spoj.apk
            rel/posledni-spoj-univerzalni.apk

      - name: Výsledek
        if: steps.build.outcome != 'success'
        run: exit 1
