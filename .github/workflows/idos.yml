name: Průzkum IDOS
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["tools/idos_probe.mjs", ".github/workflows/idos.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node tools/idos_probe.mjs || true
      - run: |
          cd o && git init -q -b idos && git config user.name bot && git config user.email bot@x && git add . && git commit -qm idos && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" idos
